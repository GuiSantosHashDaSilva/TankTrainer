name: Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Web
        run: |
          mkdir -p docs
          godot --headless --path . \
            --export-release "Web" docs/index.html

      - name: Commit build
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "build: update web export"
          file_pattern: docs/*